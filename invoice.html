<!doctype html>
<html lang="fa" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>فاکتور سفارش</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;500;600;700;800&family=Lalezar&display=swap" rel="stylesheet"><link rel="stylesheet" href="styles.css">
<style>.invoice-wrap{max-width:760px;margin:25px auto}.invoice{background:var(--card);border:2px solid var(--ink);border-radius:18px;padding:28px}.invoice-head{display:flex;justify-content:space-between;gap:20px;border-bottom:2px dashed var(--ink);padding-bottom:20px}.invoice-logo{display:flex;align-items:center;gap:10px}.invoice-logo strong{font-family:"Lalezar";font-weight:400;font-size:17px}.invoice-logo .brand-mark{width:45px;height:45px;font-size:20px}.invoice-meta{text-align:left;font-size:10px;color:var(--ink-soft);line-height:2}.customer-box{background:var(--paper);border:1px dashed var(--ink);border-radius:12px;padding:14px;margin:18px 0;display:grid;grid-template-columns:1fr 1fr;gap:8px;font-size:10px}.customer-box b{display:block;font-size:11px;color:var(--ink);margin-top:3px}.invoice table{width:100%;border-collapse:collapse;font-size:10px}.invoice th,.invoice td{text-align:right;padding:11px 7px;border-bottom:1px dashed var(--market-line)}.invoice th{color:var(--ink-soft);background:var(--paper)}.invoice-total{margin-top:18px;margin-right:auto;width:min(330px,100%);font-size:11px}.invoice-total div{display:flex;justify-content:space-between;padding:6px 0}.invoice-total .final{font-size:17px;font-weight:800;border-top:2px dashed var(--ink);margin-top:6px;padding-top:12px;font-family:"Lalezar"}.invoice-actions{display:flex;gap:8px;margin-top:16px}.invoice-actions .primary-btn{flex:1}@media(max-width:600px){.invoice-wrap{margin:8px}.invoice{padding:17px;border-radius:15px}.invoice-head{flex-direction:column}.invoice-meta{text-align:right}.customer-box{grid-template-columns:1fr}.invoice table{font-size:9px}.invoice th,.invoice td{padding:8px 4px}}@media print{body{background:#fff}.invoice-wrap{margin:0;max-width:none}.invoice{border:0;box-shadow:none}.invoice-actions{display:none}.site-header,.footer{display:none!important}}</style>
</head><body><div class="invoice-wrap"><div class="invoice" id="invoice"><div class="invoice-head"><div class="invoice-logo"><span class="brand-mark">🧺</span><div><strong>فروشگاه روزمره</strong><small style="display:block;color:#8a938e">فاکتور خرید آنلاین</small></div></div><div class="invoice-meta" id="meta"></div></div><div class="customer-box" id="customer"></div><table><thead><tr><th>محصول</th><th>تعداد</th><th>قیمت</th><th>تخفیف</th><th>مبلغ</th></tr></thead><tbody id="items"></tbody></table><div class="invoice-total" id="totals"></div><div class="invoice-actions"><button class="primary-btn" onclick="window.print()">دانلود / چاپ فاکتور</button><a class="outline-btn" href="index.html">بازگشت به فروشگاه</a></div></div></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script>
const CONFIG={SUPABASE_URL:"https://uvvbugnapdxnarartxvy.supabase.co",SUPABASE_ANON_KEY:"sb_publishable_F8z6hG_34Q4SrTAI_NoZHg_eCD2a_Rn"};const sb=supabase.createClient(CONFIG.SUPABASE_URL,CONFIG.SUPABASE_ANON_KEY);
const money=n=>new Intl.NumberFormat("fa-IR").format(Math.round(Number(n)||0))+" تومان",esc=s=>String(s??"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[m]));
(async()=>{const q=new URLSearchParams(location.search),no=q.get("order");let o=null;if(q.get("demo")==="1")o=JSON.parse(localStorage.getItem("last_order")||"null");else if(!CONFIG.SUPABASE_URL.includes("YOUR_")){const r=await sb.rpc("get_order_by_number",{p_order_number:no});if(!r.error)o=r.data?.[0]}if(!o){document.getElementById("invoice").innerHTML='<div class="empty-state">فاکتور پیدا نشد.</div>';return}render(o)})();
function render(o){document.getElementById("meta").innerHTML=`شماره سفارش: <b>${esc(o.order_number)}</b><br>تاریخ: ${new Date(o.created_at).toLocaleDateString("fa-IR")}<br>ساعت: ${new Date(o.created_at).toLocaleTimeString("fa-IR",{hour:"2-digit",minute:"2-digit"})}`;document.getElementById("customer").innerHTML=`<div>نام مشتری<b>${esc(o.customer_name)}</b></div><div>شماره موبایل<b>${esc(o.phone)}</b></div><div style="grid-column:1/-1">آدرس<b>${esc(o.address)}</b></div>`;const items=o.items||[];document.getElementById("items").innerHTML=items.map(i=>`<tr><td>${esc(i.product_name)}</td><td>${i.quantity}</td><td>${money(i.store_price||i.unit_price)}</td><td>${money((i.consumer_price-(i.store_price||i.unit_price))*i.quantity)}</td><td>${money((i.store_price||i.unit_price)*i.quantity)}</td></tr>`).join("");document.getElementById("totals").innerHTML=`<div><span>جمع قیمت مصرف‌کننده</span><b>${money(o.subtotal)}</b></div><div><span>مجموع تخفیف</span><b>${money(o.discount_total)}</b></div><div class="final"><span>مبلغ نهایی</span><b>${money(o.final_total)}</b></div>`}
</script></body></html>
